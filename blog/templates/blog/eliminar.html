{% extends "base.html" %}

{% block content %}
<section class="py-24 bg-slate-50 min-h-screen flex items-center justify-center relative overflow-hidden">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-rose-50/50 rounded-full blur-[120px] -z-10"></div>
    <div class="absolute bottom-10 right-10 w-64 h-64 bg-emerald-50/40 rounded-full blur-3xl -z-10"></div>

    <div class="container mx-auto px-6 relative z-10">
        <div class="max-w-xl mx-auto bg-white/80 backdrop-blur-xl rounded-[3.5rem] p-12 shadow-2xl border border-white text-center relative overflow-hidden">
            
            <div class="w-24 h-24 bg-rose-50 rounded-[2rem] flex items-center justify-center mx-auto mb-8 animate-bounce">
                <i class="fas fa-trash-alt text-3xl text-rose-500"></i>
            </div>

            <h2 class="serif-font text-3xl font-black text-slate-900 mb-4">
                ¿Eliminar <span class="italic text-rose-500 font-light">publicación</span>?
            </h2>
            
            <p class="text-slate-500 font-medium mb-10 leading-relaxed px-4">
                Estás a punto de borrar <span class="text-slate-900 font-bold">"{{ post.titulo }}"</span>. 
                Esta acción es permanente y no se podrá recuperar el contenido.
            </p>

            <form method="POST" class="flex flex-col sm:flex-row gap-4 justify-center">
                {% csrf_token %}
                
                <a href="{% url 'blog:listar_publicaciones' %}" 
                   class="px-10 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-slate-200 transition-all order-2 sm:order-1">
                    No, mantener post
                </a>

                <button type="submit" 
                        class="group relative px-10 py-4 bg-rose-600 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest overflow-hidden transition-all hover:shadow-xl hover:shadow-rose-900/20 active:scale-95 order-1 sm:order-2">
                    <span class="relative z-10">Sí, eliminar ahora</span>
                    <div class="absolute inset-0 bg-rose-700 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                </button>
            </form>

            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-slate-50 rounded-full -z-10"></div>
        </div>
    </div>
</section>

<style>
    .serif-font { font-family: 'Playfair Display', serif; }
</style>
{% endblock %}
