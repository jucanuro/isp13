        <div class="bg-white py-4 px-8 flex justify-between items-center shrink-0 border-t border-slate-100">

                    <div class="w-2 h-2 rounded-full bg-blue-900"></div>

            </div>
            
            <button onclick="closeNewsModal()" class="px-8 py-2.5 bg-blue-900 text-white text-[10px] font-black uppercase tracking-widest rounded-xl hover:bg-amber-500 transition-all shadow-lg active:scale-95">
                Cerrar Anuncio
            </button>
        </div>
    </div>
</div>
<style>
    /* 1. Configuración del Carrusel */
    .carousel-img {
        position: absolute;
        inset: 0;
        opacity: 0;
        background-size: cover;
        background-position: center;
        transition: opacity 1.5s ease-in-out, transform 8s linear;
        transform: scale(1.1);
        z-index: 5;
    }
    .carousel-img.active {
        opacity: 1;
        transform: scale(1);
        z-index: 10;
    }

    /* 2. Animación de Haces de Luz */
    .light-beam-1, .light-beam-2 {
        position: absolute; 
        width: 200%; 
        height: 200px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
        transform: rotate(-45deg); 
        top: -50%; 
        left: -50%;
        animation: beam 15s infinite linear;
    }
    .light-beam-2 { animation-delay: 7s; }
    @keyframes beam {
        0% { transform: rotate(-45deg) translateY(-500px); }
        100% { transform: rotate(-45deg) translateY(1500px); }
    }

    /* 3. CORTE TIPO DIPLOMA (Pestaña Trapezoidal Profesional) */
    /* Este diseño corta la base del carrusel en forma de trapecio hacia afuera */
    .diploma-cut-base {
        clip-path: polygon(0 0, 100% 0, 100% 85%, 55% 85%, 53% 95%, 47% 95%, 45% 85%, 0 85%);
    }

    /* 4. Formas Elegantes Decorativas */
    .elegant-shape {
        position: absolute;
        background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1);
        z-index: 35;
    }

    /* 5. Scrollbar Moderno para el Modal */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.1); }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(251, 191, 36, 0.4);
        border-radius: 10px;
    }
</style>

<section id="inicio" class="relative min-h-screen w-full flex items-center justify-center overflow-hidden bg-[#f8fafc]">
    
    <div class="absolute inset-0 z-0 diploma-cut-base shadow-2xl overflow-hidden bg-[#0f172a]">
        <div id="carousel-container" class="relative w-full h-full">
            <div class="carousel-img active" style="background-image: url('https://images.unsplash.com/photo-1523050335392-93851179ae22?q=80&w=2070'); opacity: 1; z-index: 10;"></div>
        </div>
        
        <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-blue-900/80 z-10"></div>
        <div class="absolute inset-0 z-20 opacity-20 mix-blend-overlay bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
        
        <div class="light-beam-1 z-30"></div>
        <div class="light-beam-2 z-30"></div>
    </div>

    <div class="absolute inset-0 z-40 pointer-events-none">
        <div class="absolute bottom-[5%] left-1/2 -translate-x-1/2 w-[10%] h-[10%] bg-amber-500 shadow-lg" 
             style="clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);">
             <div class="w-full h-full bg-gradient-to-t from-black/20 to-transparent"></div>
        </div>
    </div>

    <div class="elegant-shape w-72 h-72 rounded-full -top-20 -left-20 opacity-30"></div>
    <div class="elegant-shape w-96 h-96 rotate-45 -top-40 -right-20 opacity-10 rounded-[4rem]"></div>

    <div class="fixed right-0 top-1/2 -translate-y-1/2 z-[100] flex flex-col gap-3 p-4">
        <a href="{% url 'investigacion:lista_tesis' %}" class="group flex items-center justify-end gap-4">
            <span class="opacity-0 group-hover:opacity-100 translate-x-4 group-hover:translate-x-0 transition-all bg-blue-900 text-white text-[10px] font-black uppercase tracking-widest py-2 px-4 rounded-lg">Repositorio</span>
            <div class="w-14 h-14 flex items-center justify-center bg-white shadow-xl rounded-2xl text-amber-500 border border-slate-100 hover:bg-amber-500 hover:text-white transition-all transform group-hover:scale-110">
                <i class="fas fa-database text-xl"></i>
            </div>
        </a>
        <a href="#" class="group flex items-center justify-end gap-4">
            <span class="opacity-0 group-hover:opacity-100 translate-x-4 group-hover:translate-x-0 transition-all bg-blue-900 text-white text-[10px] font-black uppercase tracking-widest py-2 px-4 rounded-lg">Plataforma EVA</span>
            <div class="w-14 h-14 flex items-center justify-center bg-white shadow-xl rounded-2xl text-blue-600 border border-slate-100 hover:bg-blue-600 hover:text-white transition-all transform group-hover:scale-110">
                <i class="fas fa-graduation-cap text-xl"></i>
            </div>
        </a>
    </div>

    <div id="modal-noticias" class="fixed inset-0 z-[9999] hidden items-center justify-center p-4 bg-blue-950/80 backdrop-blur-xl">
        <div id="modal-content" class="relative bg-blue-900 w-full max-w-3xl h-[85vh] rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col border border-white/10 transform transition-all scale-95 opacity-0 duration-500">
            <div class="bg-white/5 px-8 py-5 flex justify-between items-center shrink-0 border-b border-white/10">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center shadow-lg">
                        <i class="fas fa-bullhorn text-blue-900"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-black text-white uppercase tracking-tighter">Comunicado Oficial</h3>
                        <p class="text-[9px] text-amber-400 font-bold uppercase tracking-widest mt-1">IESPP 13 DE JULIO</p>
                    </div>
                </div>
                <button onclick="closeNewsModal()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/10 text-white hover:bg-red-500 transition-all">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>

            <div class="flex-grow bg-slate-900 overflow-y-auto custom-scrollbar">
                <img src="{% static 'img/publicidad.jpeg' %}" class="w-full h-auto" alt="Publicidad">
            </div>

            <div class="bg-white py-4 px-8 flex justify-between items-center shrink-0">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Información 2026</span>
                <button onclick="closeNewsModal()" class="px-8 py-2.5 bg-blue-900 text-white text-[10px] font-black uppercase rounded-xl hover:bg-amber-500 transition-all">
                    Entendido
                </button>
            </div>
        </div>
    </div>
</section>

<script>
    const images = [
        'https://images.unsplash.com/photo-1523050335392-93851179ae22?q=80&w=2070',
        'https://images.unsplash.com/photo-1541339907198-e08756ebafe1?q=80&w=2070',
        'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=2071',
        'https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?q=80&w=2070',
        'https://images.unsplash.com/photo-1498243639159-00cd3e0ca9ec?q=80&w=2070',
        'https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=2070'
    ];

    const container = document.getElementById('carousel-container');
    for(let i = 1; i < images.length; i++) {
        const img = document.createElement('div');
        img.className = 'carousel-img';
        img.style.backgroundImage = `url('${images[i]}')`;
        container.appendChild(img);
    }

    let currentStep = 0;
    const slides = document.querySelectorAll('.carousel-img');

    function nextSlide() {
        slides[currentStep].classList.remove('active');
        currentStep = (currentStep + 1) % slides.length;
        slides[currentStep].classList.add('active');
    }
    setInterval(nextSlide, 5000);

    // Modal al cargar
    window.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById('modal-noticias');
        const content = document.getElementById('modal-content');
        modal.classList.replace('hidden', 'flex');
        setTimeout(() => {
            content.classList.remove('scale-95', 'opacity-0');
            content.classList.add('scale-100', 'opacity-100');
        }, 300);
    });

    function closeNewsModal() {
        const modal = document.getElementById('modal-noticias');
        const content = document.getElementById('modal-content');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => { modal.classList.replace('flex', 'hidden'); }, 400);
    }
</script>
