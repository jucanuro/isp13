<section id="inicio" class="relative min-h-screen w-full flex items-center justify-center overflow-hidden bg-[#0f172a]">
    
    <div class="absolute inset-0 z-0">
        <div id="carousel-container" class="relative w-full h-full">
            <div class="carousel-img active" style="background-image: url('https://images.unsplash.com/photo-1523050335392-93851179ae22?q=80&w=2070'); opacity: 1; z-index: 10;"></div>
        </div>
        
        <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-blue-900/60 z-10"></div>
        <div class="absolute inset-0 z-20 opacity-30 mix-blend-overlay bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
        
        <div class="light-beam-1 z-30"></div>
        <div class="light-beam-2 z-30"></div>
    </div>

    <div class="fixed right-0 top-1/2 -translate-y-1/2 z-[100] flex flex-col gap-3 p-4">
        <a href="#" class="group flex items-center justify-end gap-4 transition-all duration-500">
            <span class="opacity-0 group-hover:opacity-100 translate-x-4 group-hover:translate-x-0 transition-all bg-blue-900 text-white text-[10px] font-black uppercase tracking-widest py-2 px-4 rounded-lg shadow-xl">Repositorio</span>
            <div class="w-14 h-14 flex items-center justify-center bg-white/90 backdrop-blur-md shadow-xl rounded-2xl text-amber-500 border border-white/20 hover:bg-amber-500 hover:text-white transition-all duration-300 transform group-hover:scale-110">
                <i class="fas fa-database text-xl"></i>
            </div>
        </a>
        <a href="#" class="group flex items-center justify-end gap-4 transition-all duration-500">
            <span class="opacity-0 group-hover:opacity-100 translate-x-4 group-hover:translate-x-0 transition-all bg-blue-900 text-white text-[10px] font-black uppercase tracking-widest py-2 px-4 rounded-lg shadow-xl">Plataforma EVA</span>
            <div class="w-14 h-14 flex items-center justify-center bg-white/90 backdrop-blur-md shadow-xl rounded-2xl text-blue-600 border border-white/20 hover:bg-blue-600 hover:text-white transition-all duration-300 transform group-hover:scale-110">
                <i class="fas fa-graduation-cap text-xl"></i>
            </div>
        </a>
        <a href="#" class="group flex items-center justify-end gap-4 transition-all duration-500">
            <span class="opacity-0 group-hover:opacity-100 translate-x-4 group-hover:translate-x-0 transition-all bg-blue-900 text-white text-[10px] font-black uppercase tracking-widest py-2 px-4 rounded-lg shadow-xl">Biblioteca</span>
            <div class="w-14 h-14 flex items-center justify-center bg-white/90 backdrop-blur-md shadow-xl rounded-2xl text-emerald-600 border border-white/20 hover:bg-emerald-600 hover:text-white transition-all duration-300 transform group-hover:scale-110">
                <i class="fas fa-book-reader text-xl"></i>
            </div>
        </a>
    </div>

    <div id="modal-noticias" class="fixed inset-0 z-[200] hidden items-center justify-center p-4 bg-black/80 backdrop-blur-lg">
        <div class="bg-white w-full max-w-4xl rounded-[3rem] overflow-hidden shadow-2xl flex flex-col md:flex-row transform transition-all scale-95 opacity-0 duration-500" id="modal-content">
            <div class="md:w-[45%] h-64 md:h-auto overflow-hidden">
                <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=1000" class="w-full h-full object-cover">
            </div>
            <div class="md:w-[55%] p-10 md:p-14 relative bg-white flex flex-col justify-center">
                <button onclick="closeNewsModal()" class="absolute top-8 right-8 text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fas fa-times text-2xl"></i>
                </button>
                <span class="text-blue-600 font-black uppercase text-[11px] tracking-widest mb-2 block">Comunicado 2026</span>
                <h2 class="serif-font text-4xl font-black text-slate-900 mb-6 leading-tight">Proceso de <span class="italic text-blue-800">Admisión Tranter</span></h2>
                <p class="text-slate-500 mb-8">Te damos la bienvenida a nuestra plataforma. Revisa las vacantes disponibles para este nuevo ciclo académico.</p>
                <button onclick="closeNewsModal()" class="w-full py-5 bg-blue-900 text-white font-black uppercase text-[10px] tracking-widest rounded-2xl hover:bg-amber-500 transition-all shadow-lg">Continuar al Sitio</button>
            </div>
        </div>
    </div>

    <div class="absolute bottom-0 left-0 w-full line-height-0 z-40">
        <svg class="relative block w-full h-[60px] lg:h-[110px]" viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,0 C300,120 900,120 1200,0 L1200,120 L0,120 Z" fill="#f8fafc"></path>
        </svg>
    </div>
</section>

<style>
    .carousel-img {
        position: absolute;
        inset: 0;
        opacity: 0;
        background-size: cover;
        background-position: center;
        transition: opacity 1.5s ease-in-out, transform 8s linear;
        transform: scale(1.1);
        z-index: 5;
    }
    .carousel-img.active {
        opacity: 1;
        transform: scale(1);
        z-index: 10;
    }
    .light-beam-1, .light-beam-2 {
        position: absolute; width: 200%; height: 200px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
        transform: rotate(-45deg); top: -50%; left: -50%;
        animation: beam 15s infinite linear;
    }
    .light-beam-2 { animation-delay: 7s; }
    @keyframes beam {
        0% { transform: rotate(-45deg) translateY(-500px); }
        100% { transform: rotate(-45deg) translateY(1500px); }
    }
    .serif-font { font-family: 'Playfair Display', serif; }
</style>

<script>
    // 1. CONFIGURACIÓN: 6 Imágenes (1 por defecto + 5 adicionales)
    const images = [
        'https://images.unsplash.com/photo-1523050335392-93851179ae22?q=80&w=2070', // Default (Campus)
        'https://images.unsplash.com/photo-1541339907198-e08756ebafe1?q=80&w=2070', // 2
        'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=2071', // 3
        'https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?q=80&w=2070', // 4
        'https://images.unsplash.com/photo-1498243639159-00cd3e0ca9ec?q=80&w=2070', // 5
        'https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=2070'  // 6
    ];

    const container = document.getElementById('carousel-container');
    
    // Inyectar las otras 5 imágenes (la primera ya está en el HTML)
    for(let i = 1; i < images.length; i++) {
        const img = document.createElement('div');
        img.className = 'carousel-img';
        img.style.backgroundImage = `url('${images[i]}')`;
        container.appendChild(img);
    }

    let currentStep = 0;
    const slides = document.querySelectorAll('.carousel-img');

    function nextSlide() {
        slides[currentStep].classList.remove('active');
        currentStep = (currentStep + 1) % slides.length;
        slides[currentStep].classList.add('active');
    }

    setInterval(nextSlide, 5000);

    // 2. MODAL: SIEMPRE AL RECARGAR
    window.onload = function() {
        const modal = document.getElementById('modal-noticias');
        const content = document.getElementById('modal-content');
        
        modal.classList.replace('hidden', 'flex');
        
        setTimeout(() => {
            content.classList.remove('scale-95', 'opacity-0');
            content.classList.add('scale-100', 'opacity-100');
        }, 150);
    };

    function closeNewsModal() {
        document.getElementById('modal-noticias').classList.replace('flex', 'hidden');
    }
</script>
