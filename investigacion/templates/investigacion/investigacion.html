<style>
    @keyframes float-aurora {
        0% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0, 0) scale(1); }
    }
    .animate-aurora {
        animation: float-aurora 15s ease-in-out infinite;
    }
</style>

<section id="investigacion" class="relative -mt-32 pt-48 pb-48 bg-[#f8fafc] overflow-hidden">
    
    <div class="absolute top-0 left-0 w-full overflow-hidden pointer-events-none rotate-180">
        <div class="absolute top-0 left-0 w-full h-32 bg-blue-900/5" 
             style="clip-path: polygon(0% 100%, 0% 20%, 5% 0%, 15% 20%, 25% 0%, 35% 20%, 45% 0%, 55% 20%, 65% 0%, 75% 20%, 85% 0%, 95% 20%, 100% 0%, 100% 100%);">
        </div>
        <div class="absolute top-0 left-0 w-full h-20 bg-blue-900/10" 
             style="clip-path: polygon(0% 100%, 0% 30%, 10% 0%, 20% 30%, 30% 0%, 40% 30%, 50% 0%, 60% 30%, 70% 0%, 80% 30%, 90% 0%, 100% 30%, 100% 100%);">
        </div>
        <div class="relative w-full h-12 bg-blue-950" 
             style="clip-path: polygon(0% 100%, 0% 50%, 25% 0%, 50% 50%, 75% 0%, 100% 50%, 100% 100%);">
        </div>
    </div>

    <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#1e3a8a 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
    
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="animate-aurora absolute -top-20 -left-20 w-[600px] h-[600px] bg-blue-100/40 rounded-full blur-[120px]"></div>
    </div>
    
    <div class="container mx-auto px-6 relative z-10">
        
        <div class="flex flex-col lg:flex-row lg:items-end justify-between mb-16 gap-10">
            <div class="max-w-xl">
                <div class="flex items-center gap-3 mb-6">
                    <span class="w-10 h-[2px] bg-blue-600 rounded-full"></span>
                    <h2 class="text-[10px] font-black text-blue-900/60 uppercase tracking-[0.6em]">Repositorio Científico</h2>
                </div>
                <h3 class="serif-font text-4xl lg:text-5xl font-light text-slate-900 tracking-tight leading-[1.1]">
                    Investigación con <br>
                    <span class="font-black italic text-blue-900">Excelencia Académica</span>
                </h3>
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-3 bg-white/90 backdrop-blur-xl border border-blue-100 rounded-[2.5rem] p-2 shadow-xl shadow-blue-900/5">
                <div class="relative group">
                    <select class="appearance-none bg-transparent pl-8 pr-12 py-3 text-[11px] font-black tracking-widest text-blue-900 cursor-pointer focus:outline-none">
                        <option>Nuestra Institución</option>
                        <option>Otras Redes</option>
                    </select>
                    <i class="fas fa-chevron-down absolute right-6 top-1/2 -translate-y-1/2 text-[10px] text-amber-500"></i>
                </div>
                <div class="h-8 w-px bg-blue-200 hidden sm:block"></div>
                <div class="relative w-full sm:w-64">
                    <input type="text" placeholder="Buscar tesis..." 
                           class="w-full bg-transparent py-3 pl-10 pr-6 text-[13px] text-slate-700 placeholder:text-slate-400 focus:outline-none">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-blue-600 text-xs"></i>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            {% for t in tesis %}
            <article class="group relative bg-white rounded-[3rem] p-10 flex flex-col h-full border border-slate-100 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all duration-500 overflow-hidden">
                
                <div class="absolute bottom-0 right-0 w-full h-1/2 bg-blue-50/50 -mb-20 -mr-20 rotate-12 opacity-0 group-hover:opacity-100 transition-all duration-700 pointer-events-none"></div>

                <div class="mb-10 flex items-center justify-between relative z-10">
                    <div class="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center group-hover:bg-blue-900 transition-all duration-500 group-hover:rotate-[360deg]">
                        <i class="fas fa-microscope text-blue-900 group-hover:text-amber-400 text-xl"></i>
                    </div>
                    <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest border border-slate-100 px-3 py-1 rounded-full">Ref. 2025</span>
                </div>

                <div class="flex-grow relative z-10">
                    <h4 class="serif-font text-xl font-bold text-slate-800 leading-[1.5] mb-6 group-hover:text-blue-900 transition-colors">
                        {{ t.title|lower|capfirst }}
                    </h4>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                        <span class="text-[9px] font-black text-blue-800 uppercase tracking-tighter italic">Publicación Oficial</span>
                    </div>
                </div>
                
                <div class="mt-10 pt-8 border-t border-slate-50 flex items-center justify-between relative z-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-900 flex items-center justify-center text-[12px] font-black text-white shadow-lg shadow-blue-200">
                            {{ t.author|slice:":1" }}
                        </div>
                        <p class="text-[13px] font-bold text-slate-700 tracking-tight">{{ t.author }}</p>
                    </div>
                    
                    <a href="{{ t.link }}" target="_blank" class="w-11 h-11 rounded-full bg-blue-50 text-blue-900 hover:bg-amber-500 hover:text-white transition-all duration-300 flex items-center justify-center shadow-sm">
                        <i class="fas fa-arrow-right text-[11px]"></i>
                    </a>
                </div>
            </article>
            {% endfor %}
        </div>
    </div>

    <div class="absolute bottom-0 left-0 w-full h-32 bg-blue-900" style="clip-path: polygon(0 60%, 100% 0, 100% 100%, 0 100%);"></div>

</section>
